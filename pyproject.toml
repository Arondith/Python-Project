[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logscope"
version = "0.1.0"
description = "A typed Python log-analysis and incident-triage toolkit."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Charles Luke Templonuevo" }
]
dependencies = [
  "pydantic>=2.10,<3",
  "rich>=13.9,<14",
  "typer>=0.15,<1"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1"
]

[project.scripts]
logscope = "logscope.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["logscope"]

[tool.coverage.run]
source = ["logscope"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
